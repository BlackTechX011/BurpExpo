name: Build and Release BurpExpo

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIXED: Changed Java version from 17 to 21 to match your Gradle config
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew jar

      - name: Find generated JAR file
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" | head -n 1)
          echo "Found JAR at: $JAR_PATH"
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "BurpExpo Release v1.0.${{ github.run_number }}"
          body: |
            Automated build triggered by a code update.
            
            **Changes:**
            - Automatically compiled latest `src` folder.
          files: ${{ env.JAR_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}